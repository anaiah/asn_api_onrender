<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fullscreen Iframe</title>
<style>
  body {
    margin: 0;
  overflow: hidden; /* Hides scrollbars */
 
    padding: 0;
  }
  iframe {
    width: 100vw;
    height: 100vh;
    border: none;
    border: none; /* Optional: removes border */
  }
</style>
</head>
<body>
  <iframe src="https://ipbiotech.lovable.app/"></iframe>
</body>
</html>
